# Test-only configuration. The credentials below exist only for automated tests against in-memory H2.
spring.datasource.url=jdbc:h2:mem:cctest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.locations=classpath:db/migration
app.bootstrap.admin.username=testadmin
app.bootstrap.admin.password=Test-Only-Admin-Passw0rd
app.bootstrap.admin.full-name=Test Administrator
app.bootstrap.admin.generate-password-if-missing=false
