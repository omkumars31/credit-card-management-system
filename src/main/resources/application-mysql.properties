# Persistent local profile: MySQL 8.x. Credentials come from environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ccbilling?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:ccbilling}
spring.datasource.password=${DB_PASSWORD:}

# Common migrations + MySQL-only append-only triggers (see README for how to disable them)
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/migration-mysql}
