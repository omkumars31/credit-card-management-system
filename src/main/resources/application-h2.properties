# Default local profile: in-memory H2 (data is lost when the application stops).
# Set H2_URL=jdbc:h2:file:./data/ccbilling;MODE=MySQL to persist data in ./data/
spring.datasource.url=${H2_URL:jdbc:h2:mem:ccbilling;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.flyway.locations=classpath:db/migration

# Local convenience only: if no BOOTSTRAP_ADMIN_* variables are set and no administrator exists yet,
# a random one-time admin password is generated and printed once to the console.
app.bootstrap.admin.generate-password-if-missing=true
