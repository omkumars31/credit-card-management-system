spring.application.name=credit-card-billing-system
# Default profile = H2 in-memory. Override with SPRING_PROFILES_ACTIVE=mysql
spring.profiles.active=h2

server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Flyway owns the schema; Hibernate only validates the mapping against it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# Pagination limits
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Session cookie hardening (set SESSION_COOKIE_SECURE=true when serving over HTTPS)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Initial administrator provisioning (see README). Values come from environment variables only.
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:Local Administrator}
app.bootstrap.admin.generate-password-if-missing=false

logging.level.root=INFO
logging.level.com.example.ccbilling=INFO
